# Every push and pull request: build everything and run the tests.
# A pushed tag v*: also gather the release and publish it on GitHub
# (the same as `make release` + tools/gh-release.sh by hand).
name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  RISCV_GCC: https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v14.2.0-3/xpack-riscv-none-elf-gcc-14.2.0-3-linux-x64.tar.gz
  ARM_GCC: https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchains
        run: |
          mkdir -p $HOME/tc
          curl -sL $RISCV_GCC | tar xz -C $HOME/tc
          curl -sL $ARM_GCC | tar xz -C $HOME/tc
          echo "$(ls -d $HOME/tc/xpack-riscv-none-elf-gcc-*)/bin" >> $GITHUB_PATH
          echo "$(ls -d $HOME/tc/xpack-arm-none-eabi-gcc-*)/bin" >> $GITHUB_PATH
          pip install --break-system-packages setuptools==80.10.2 pillow==12.3.0 pyfatfs==1.1.0 yowasp-nextpnr-ecp5==0.11.1.0.post826 yowasp-yosys==0.71.0.0.post1285
          git clone -q --depth 1 -b 1.5.1 https://github.com/raspberrypi/pico-sdk $HOME/pico-sdk
          git -C $HOME/pico-sdk submodule update -q --init --depth 1 lib/tinyusb

      - name: Tests
        run: make test

      - name: Release files
        run: make release PICO_SDK_PATH=$HOME/pico-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: machboot-release
          path: build/release/*.zip

      - name: Publish (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*MB_VERSION_STR[[:space:]]*"\(.*\)".*/\1/p' fw/mb.h)
          [ "v$VER" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match MB_VERSION_STR $VER"; exit 1; }
          tools/gh-release.sh
